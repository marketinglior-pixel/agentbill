[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbill"
version = "0.1.0"
description = "Usage-based billing for AI agent developers"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx"]
