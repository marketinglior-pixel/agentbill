# fly.toml app configuration file generated for agentbill on 2026-05-02T19:21:10+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agentbill'
primary_region = 'sin'

# Deploy with `npm run deploy`, not a bare `flyctl deploy`.
#
# The image reports the commit it was built from on GET /health and on /status,
# and it can only do that if the build receives it: scripts/deploy.sh passes
# --build-arg GIT_SHA and refuses a dirty tree. A bare `flyctl deploy` still
# ships; the image just reports "unknown" for its commit.
[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
