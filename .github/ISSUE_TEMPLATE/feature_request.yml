name: Feature Request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe your use case clearly — the more concrete, the better.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation where this feature would help.
      placeholder: "When building a multi-agent pipeline, I need to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you're proposing.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds or other approaches you've tried?

  - type: dropdown
    id: component
    attributes:
      label: Which component?
      options:
        - Python SDK
        - Node.js SDK
        - MCP Server
        - Backend API
        - Docs / README
        - Other / Not sure
