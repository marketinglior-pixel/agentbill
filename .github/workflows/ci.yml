name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  python-sdk:
    name: Python SDK install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK with dev deps
        run: pip install -e "sdk/python[dev]"
      - name: Verify SDK imports
        run: python -c "from agentbill import AgentBillClient; print('SDK OK')"

  mcp:
    name: MCP server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MCP server
        run: pip install -e mcp/
      - name: Verify MCP imports
        run: python -c "import agentbill_mcp; print('MCP server OK')"
