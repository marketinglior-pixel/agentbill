name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

  hygiene:
    name: Design drift and copy rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # A one-way valve on the two kinds of drift design.md forbids: hardcoded
      # font sizes outside the scale, and raw hexes below a :root block. It
      # fails only when a count rises, so the existing ones can be retired by
      # whatever commit next touches their block.
      - name: Design drift ratchet
        run: npm run check:ratchet
      # design.md: no em dash on any rendered surface. Nothing enforced it.
      - name: Copy and head rules
        run: npm run check:hygiene

  python-sdk:
    name: Python SDK install and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK with dev deps
        run: pip install -e "sdk/python[dev]"
      - name: Verify SDK imports
        run: python -c "from agentbill import AgentBillClient; print('SDK OK')"
      # These two tests existed since f66dfed and nothing ran them: the job
      # installed pytest as a dev dep and then only imported the package, so
      # the repo looked covered and was not.
      - name: Unit tests
        working-directory: sdk/python
        run: python -m pytest tests -q

  mcp:
    name: MCP server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MCP server
        run: pip install -e mcp/
      - name: Verify MCP imports
        run: python -c "import agentbill_mcp; print('MCP server OK')"

  preflight:
    name: Preflight gate correctness against a real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Migrate a scratch DB, start the server, assert the gate
        run: ./scripts/preflight/run.sh

  snippets:
    name: Published code samples run against the SDKs in this repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Extract every <pre> and fenced block, typecheck and execute them
        run: ./scripts/snippets/run.sh repo

  snippets-published:
    # Same samples against what PyPI and npm actually serve. A GATE since
    # 2026-09-03, not a warning. It spent three days reporting success while
    # the live site taught an idempotency_key that no published SDK had,
    # because continue-on-error paints a failed job green and nobody reads a
    # green job. A check whose failure is invisible is not a check.
    #
    # The contract: main is what the site deploys, so a sample on the site has
    # to run against the packages a reader can actually install. If a sample
    # starts using a new SDK feature, publish the SDK before pushing it.
    name: Published code samples run against PyPI and npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: ./scripts/snippets/run.sh published
      - if: failure()
        run: |
          echo "## Published SDK drift" >> "$GITHUB_STEP_SUMMARY"
          echo "A published code sample does not run against what PyPI or npm currently serve." >> "$GITHUB_STEP_SUMMARY"
          echo "Either the sample is wrong, or the SDK it documents has not been published yet." >> "$GITHUB_STEP_SUMMARY"
