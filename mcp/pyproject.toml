[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbill-mcp"
version = "0.2.0"
description = "AgentBill MCP server. Add spend controls and billing to any AI agent in 3 lines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    # Upper bound is load-bearing, not caution. mcp 2.x renamed FastMCP to
    # MCPServer, so an unpinned ">=1.0.0" resolves to 2.x and this server dies
    # on import. That is what shipped in 0.1.1: every fresh uvx agentbill-mcp
    # has been failing since mcp 2 was released. Migrating to the 2.x API is a
    # separate change; this pin restores a package that runs.
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27",
]
authors = [
    { name = "AgentBill", email = "marketinglior@gmail.com" }
]
keywords = [
    "mcp",
    "ai-agents",
    "billing",
    "llm",
    "agent-billing",
    "spend-ceiling",
    "preflight",
    "usage-based",
    "langchain",
    "claude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://agentbill.dev"
Repository = "https://github.com/marketinglior-pixel/agentbill"
Documentation = "https://github.com/marketinglior-pixel/agentbill#readme"

[project.scripts]
agentbill-mcp = "agentbill_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["agentbill_mcp"]
